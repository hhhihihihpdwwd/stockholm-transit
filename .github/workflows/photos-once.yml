name: Stockholm Transit - ONE TIME import and store vehicle photos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockholm-photo-import
  cancel-in-progress: false

jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch photos once and preserve previously saved photos
        run: |
          python -u scripts/fetch_photos.py
          python -u scripts/local_photos.py
      - name: Show missing photos without failing
        run: |
          python - <<'PY2'
          import json
          p='public/assets/photos/photo-health.json'
          r=json.load(open(p))
          print('LOCAL PHOTO COUNT:',r['available'],'/',r['expected'])
          for key,reason in r['missing'].items():print('NEEDS REVIEW:',key,reason)
          PY2
      - name: Upload photo audit and local files for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockholm-v10-photos-and-audit
          path: |
            public/assets/photos/
          retention-days: 30
          if-no-files-found: warn
      - name: Permanently commit downloaded photos, captions and credits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/assets/photos
          if git diff --cached --quiet; then
            echo 'No new photographs to save'
          else
            git commit -m 'Store inspected local vehicle images for static transit site'
            git push
          fi
