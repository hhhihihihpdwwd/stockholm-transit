name: Stockholm Transit V8 - Build Stockholm PBF world (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockholm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Install local OSM parser
        run: python -m pip install --disable-pip-version-check osmium
      - name: Generate one-time archive timetable (no Trafiklab keys)
        env:
          GTFS_ARCHIVE_URL: https://data.samtrafiken.se/trafiklab/gtfs-sverige-2/2026/11/sweden-20261104.zip
          PHOTO_DOWNLOAD: '1'
          OSM_GEOMETRY: '1'
        run: python -u scripts/build.py
      - name: Validate the offline dataset before publishing
        run: |
          python - <<'PY'
          import json,collections,pathlib,sys
          root=pathlib.Path('public/data')
          m=json.loads((root/'manifest.json').read_text())
          n=json.loads((root/'network.json').read_text())
          assert m.get('weekly_repeat') and len(m['dates'])==7, 'Missing representative weekly schedule'
          assert n['routes'] and n['stops'], 'Empty network'
          counts=collections.Counter()
          for day in m['dates']:
              trips=json.loads((root/(day+'.json')).read_text())['trips']
              for t in trips: counts[n['routes'][t[0]][2]]+=1
          print('ARCHIVE MODES ACROSS WEEK:',dict(counts),flush=True)
          important=('metro','commuter','bus','rail')
          missing=[x for x in important if counts[x]==0]
          if missing:
              print('STOP: Missing essential modes from snapshot:',missing,file=sys.stderr)
              raise SystemExit(2)
          geometry=collections.Counter()
          for day in m['dates']:
              for t in json.loads((root/(day+'.json')).read_text())['trips']:
                  if t[2]>=0:geometry[n['routes'][t[0]][2]]+=1
          print('VERIFIED OSM ROUTE COVERAGE:',{mode:f'{geometry[mode]}/{counts[mode]}' for mode in counts},flush=True)
          # Never replace last release with a version where every metro or bus
          # is parked at stops due to an unavailable geodata provider.
          if counts['metro'] and geometry['metro']/counts['metro']<.35:
              raise SystemExit('STOP: Less than 35% of metro trips follow mapped tracks')
          if counts['bus'] and geometry['bus']/counts['bus']<.20:
              raise SystemExit('STOP: Less than 20% of Stockholm bus trips follow mapped roads')
          print('Validated historical weekly simulation. No daily Trafiklab download.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish archived simulation
        id: deployment
        uses: actions/deploy-pages@v4
