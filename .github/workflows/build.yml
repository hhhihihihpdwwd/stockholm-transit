name: Stockholm Transit V9.1 - Routes and photo repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockholm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Install OSM tools for offline Sweden and Stockholm extracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install --disable-pip-version-check osmium
      - name: Generate national railway geometry and Stockholm street timetable
        env:
          GTFS_ARCHIVE_URL: https://data.samtrafiken.se/trafiklab/gtfs-sverige-2/2026/11/sweden-20261104.zip
          PHOTO_DOWNLOAD: '1'
          OSM_GEOMETRY: '1'
          SWEDEN_OSM_URL: https://download.geofabrik.de/europe/sweden-latest.osm.pbf
        run: python -u scripts/build.py
      - name: Validate full-network dataset before publishing
        run: |
          python - <<'PY'
          import json,collections,pathlib,sys
          root=pathlib.Path('public/data')
          m=json.loads((root/'manifest.json').read_text())
          n=json.loads((root/'network.json').read_text())
          assert m.get('weekly_repeat') and len(m['dates'])==7, 'Missing representative weekly schedule'
          assert n['routes'] and n['stops'], 'Empty network'
          counts=collections.Counter()
          for day in m['dates']:
              trips=json.loads((root/(day+'.json')).read_text())['trips']
              for t in trips: counts[n['routes'][t[0]][2]]+=1
          print('ARCHIVE MODES ACROSS WEEK:',dict(counts),flush=True)
          important=('metro','commuter','bus','rail')
          missing=[x for x in important if counts[x]==0]
          if missing:
              print('STOP: Missing essential modes from snapshot:',missing,file=sys.stderr)
              raise SystemExit(2)
          geometry=collections.Counter()
          for day in m['dates']:
              for t in json.loads((root/(day+'.json')).read_text())['trips']:
                  if t[2]>=0:geometry[n['routes'][t[0]][2]]+=1
          print('MAPPED OSM ROUTE COVERAGE:',{mode:f'{geometry[mode]}/{counts[mode]}' for mode in counts},flush=True)
          # Never replace last release with a version where every metro or bus
          # is parked at stops due to an unavailable geodata provider.
          if counts['metro'] and geometry['metro']/counts['metro']<.60:
              raise SystemExit('STOP: Less than 60% of metro trips follow mapped tracks')
          if counts['bus'] and geometry['bus']/counts['bus']<.40:
              raise SystemExit('STOP: Less than 40% of Stockholm bus trips follow mapped roads')
          if counts['rail'] and geometry['rail']/counts['rail']<.35:
              raise SystemExit('STOP: Less than 35% of Stockholm-serving long-distance rail trips follow mapped tracks')
          print('Validated V9 historical simulation with real OSM rail routes. No daily Trafiklab download.')
          PY
      - name: Verify routes against the browser's stop-to-shape renderer
        run: python -u scripts/validate_display.py
      - name: Prevent a regression in actually displayed routes
        run: |
          python - <<'PY3'
          import json, pathlib, collections
          data=json.loads(pathlib.Path('public/data/display-coverage.json').read_text())
          totals=collections.defaultdict(lambda:[0,0])
          for line in data['lines']:
              p=totals[line['mode']]
              p[0]+=line['displayable'];p[1]+=line['total']
          print('DISPLAYABLE ROUTES BY MODE:',{k:f'{v[0]}/{v[1]}' for k,v in totals.items()})
          # Protect the current release against silent geometry regressions.
          minimum={'metro':.70,'commuter':.90,'bus':.70,'rail':.65}
          failures=[m for m,limit in minimum.items() if totals[m][1] and totals[m][0]/totals[m][1]<limit]
          if failures:
              raise SystemExit('STOP: browser-displayable coverage below floor: '+', '.join(failures))
          PY3
      - name: Check photo availability and publish audit report
        run: |
          python - <<'PY2'
          import json,pathlib
          p=pathlib.Path('public/assets/photos/photo-health.json')
          if not p.exists():
              raise SystemExit('Photo health report missing')
          report=json.loads(p.read_text())
          print('PHOTOS:',report['downloaded'],'/',report['expected'])
          print('MISSING PHOTO KEYS:',sorted(report['missing']))
          # Do not publish an update without recognizable core Stockholm vehicles.
          catalog=json.loads(pathlib.Path('public/assets/photos/catalog.json').read_text())
          essential=['commuter_x60','rail_arlanda','rail_malartag','bus_red69']
          missing=[k for k in essential if k not in catalog]
          if missing:
              raise SystemExit('STOP: essential vehicle photographs missing: '+', '.join(missing))
          PY2
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish archived simulation
        id: deployment
        uses: actions/deploy-pages@v4
